[package]
name = "rust_sdk_tester"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.3.0"
serde = { version = "1", features = ["derive"] }
moss_macros = { path = "src/moss_macros" }
once_cell = "1.20.3"
serde_json = "1.0.137"
derive_builder = "0.20.2"
chrono = "0.4.39"
base64 = "0.22.1"